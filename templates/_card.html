<article class="property-card">
    <a href="{{ url_for('property_detail', property_id=p['id']) }}" class="image-wrap">
        <img src="{{ image_url(p['id']) }}" alt="{{ p['title'] }}">
        <span class="badge">{{ p['listing_type'] }}</span>
    </a>

    <div class="card-body">
        <div class="muted">
            {{ p['property_type'] }} · {{ "{:,.0f}".format(p['size_sqft']) }} sq ft
        </div>

        <h3>{{ p['title'] }}</h3>

        <p class="location">
            📍 {{ p['city'] }}, {{ p['postcode'] }}
        </p>

        <p class="description">
            {{ p['description']|truncate(105) }}
        </p>

        <div class="card-bottom">
            <strong>
                {{ p|property_price }}
                <small>{{ p['price_period'] }}</small>
            </strong>

            <span>{{ p['parking'] }} parking</span>
        </div>

        <a class="btn outline full"
           href="{{ url_for('property_detail', property_id=p['id']) }}">
            View property
        </a>
    </div>
</article>
