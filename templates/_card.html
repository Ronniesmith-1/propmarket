<article class="property-card">
  <a class="image-wrap" href="{{ url_for('property_detail',property_id=p['id']) }}">
    <img src="{{ image_url(p['id']) }}" alt="{{ p['title'] }}">
    <span class="badge">{{ p['listing_type'] }}</span>
  </a>
  <div class="card-body">
    <div class="muted">{{ p['property_type'] }} · {{ "{:,.0f}".format(p['size_sqft']) }} sq ft</div>
    <h3>{{ p['title'] }}</h3>
    <p class="location">📍 {{ p['public_area'] or p['city'] }}, {{ p['city'] }}</p>
    <p class="description">{{ p['description']|truncate(105) }}</p>
    <div class="card-bottom">
      <strong>{{ p['price']|money }} <small>{{ p['price_period'] }}</small></strong>
      <span>{{ p['parking'] }} parking</span>
    </div>
    <a class="btn outline full" href="{{ url_for('property_detail',property_id=p['id']) }}">View property</a>
  </div>
</article>
